name: Publish Docs

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'typedoc.json'
      - 'docs-site/**'
      - 'scripts/**'
      - 'package.json'
      - 'yarn.lock'
      - 'CHANGELOG.md'
      - '.github/workflows/docs.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn

      - name: Install root dependencies
        run: yarn install --frozen-lockfile

      - name: Install docs-site dependencies
        run: yarn --cwd docs-site install --frozen-lockfile

      - name: Generate API markdown and build Starlight
        run: yarn docs:build
        env:
          # Ensure Astro uses GitHub Pages base path
          GITHUB_ACTIONS: 'true'
          NODE_ENV: production

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/dist

      - uses: actions/deploy-pages@v5
        id: deployment
